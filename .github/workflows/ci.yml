name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:coverage

      - name: PDF→Word quality regression
        run: npm run test:pdf-to-word-quality

      - name: Security audit
        run: npm run audit:ci

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
          IP_HASH_SALT: ci-test-salt
          CRON_SECRET: ci-cron-secret
          HEALTH_CHECK_SECRET: ci-health-check-secret
          RAZORPAY_KEY_ID: rzp_test_ci
          RAZORPAY_KEY_SECRET: ci_secret
          RAZORPAY_WEBHOOK_SECRET: ci_webhook
          UPSTASH_REDIS_REST_URL: https://ci-example.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci-upstash-token
          SENTRY_DSN: https://ci@sentry.io/1
          RESEND_API_KEY: re_ci_test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests (smoke, a11y, CWV budgets)
        run: npm run test:e2e
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci_supabase_anon_key_not_a_real_secret_0123456789
          SUPABASE_SERVICE_ROLE_KEY: ci_supabase_service_role_not_a_real_secret_0123456789
          IP_HASH_SALT: ci-test-salt
          CRON_SECRET: ci-cron-secret
          HEALTH_CHECK_SECRET: ci-health-check-secret
          RAZORPAY_KEY_ID: rzp_test_ci
          RAZORPAY_KEY_SECRET: ci_secret
          RAZORPAY_WEBHOOK_SECRET: ci_webhook
          UPSTASH_REDIS_REST_URL: https://ci-example.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci-upstash-token
          SENTRY_DSN: https://ci@sentry.io/1
          RESEND_API_KEY: re_ci_test
