name: OCR searchable PDF geometry contracts

on:
  push:
    branches: [phase1-dependable-beta]
    paths:
      - ".github/workflows/phase3-ocr-geometry.yml"
      - "scripts/pdf-advanced-tools.py"
      - "scripts/test_pdf_advanced_tools.py"
      - "scripts/test_ocr_pdf_geometry.py"
      - "scripts/phase3-ocr-geometry-corpus.py"
      - "scripts/test_phase3_ocr_geometry_corpus.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing PDF dependencies
        run: python -m pip install --disable-pip-version-check pymupdf pillow
      - name: Verify OCR geometry, failure handling and corpus validation
        run: |
          python -m unittest discover -s scripts -p test_ocr_pdf_geometry.py
          python -m unittest discover -s scripts -p test_pdf_advanced_tools.py
          python -m unittest discover -s scripts -p test_phase3_ocr_geometry_corpus.py
