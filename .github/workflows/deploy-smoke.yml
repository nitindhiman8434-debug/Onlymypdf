name: Deploy Smoke Test

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:
    inputs:
      target_url:
        description: "Production URL (e.g. https://onlymypdf.com)"
        required: true
        type: string

jobs:
  smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Resolve target URL
        id: url
        run: |
          if [ -n "${{ github.event.inputs.target_url }}" ]; then
            echo "base=${{ github.event.inputs.target_url }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.PRODUCTION_URL }}" ]; then
            echo "base=${{ secrets.PRODUCTION_URL }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=" >> "$GITHUB_OUTPUT"
          fi

      - name: Require PRODUCTION_URL after CI
        if: github.event_name == 'workflow_run' && steps.url.outputs.base == ''
        run: |
          echo "Repository secret PRODUCTION_URL is required for post-CI deploy smoke."
          exit 1

      - name: Health check
        if: steps.url.outputs.base != ''
        run: |
          BASE="${{ steps.url.outputs.base }}"
          echo "Smoke testing $BASE"
          curl -fsS "$BASE/api/health" | tee health.json
          node -e "
            const h = require('./health.json');
            if (!h.status) throw new Error('Missing health status');
            if (h.status === 'degraded') throw new Error('Health is degraded');
            console.log('Health status:', h.status);
          "
          curl -fsS -o /dev/null -w "%{http_code}" "$BASE/" | grep -E '^200$'
          curl -fsS -o /dev/null -w "%{http_code}" "$BASE/robots.txt" | grep -E '^200$'
          curl -fsS -o /dev/null -w "%{http_code}" "$BASE/sitemap.xml" | grep -E '^200$'

      - name: Detailed health check (authenticated)
        if: steps.url.outputs.base != ''
        env:
          HEALTH_CHECK_SECRET: ${{ secrets.HEALTH_CHECK_SECRET }}
        run: |
          if [ -z "$HEALTH_CHECK_SECRET" ]; then
            echo "HEALTH_CHECK_SECRET secret not configured — skipping detailed health."
            exit 0
          fi
          BASE="${{ steps.url.outputs.base }}"
          curl -fsS -H "Authorization: Bearer $HEALTH_CHECK_SECRET" "$BASE/api/health" | tee health-detail.json
          node -e "
            const h = require('./health-detail.json');
            if (!h.checks) throw new Error('Missing detailed health checks');
            if (h.status === 'degraded') throw new Error('Detailed health is degraded');
            console.log('Detailed health:', h.status, Object.keys(h.checks));
          "

      - name: Skip (manual run without URL)
        if: github.event_name == 'workflow_dispatch' && steps.url.outputs.base == ''
        run: |
          echo "Provide target_url input or set PRODUCTION_URL secret."
          exit 1
