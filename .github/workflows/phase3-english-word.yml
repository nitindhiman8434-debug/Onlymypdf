name: English OCR Word quality contracts

on:
  push:
    branches: [phase1-dependable-beta]
    paths:
      - ".github/workflows/phase3-english-word.yml"
      - "scripts/pdf-to-docx.py"
      - "scripts/ocr_english_docx.py"
      - "scripts/test_ocr_english_docx.py"
      - "scripts/phase3-english-word-corpus.py"
      - "scripts/test_phase3_english_word_corpus.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing converter dependencies
        run: python -m pip install --disable-pip-version-check pdf2docx pillow
      - name: Check editable English output and strict corpus validators
        run: |
          python -m unittest discover -s scripts -p test_ocr_english_docx.py
          python -m unittest discover -s scripts -p test_phase3_english_word_corpus.py
