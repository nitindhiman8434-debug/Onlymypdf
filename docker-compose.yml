# ============================================================
# OnlyMyPDF — local + small-VPS docker stack
# Services: nextjs, laravel, mysql, redis, python-worker, nginx
# Tuned to run on a 4 vCPU / 8 GB VPS (₹10k–₹12k/month range).
# ============================================================
version: "3.9"

services:
  # ---------- Frontend (Next.js) ----------
  nextjs:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omp_nextjs
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - laravel
    networks:
      - omp

  # ---------- Backend (Laravel API + Filament admin) ----------
  laravel:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omp_laravel
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www/html
      - omp_temp:/var/www/html/storage/app/temp
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      - mysql
      - redis
    networks:
      - omp

  # ---------- Queue workers + Horizon (same image, different cmd) ----------
  horizon:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omp_horizon
    restart: unless-stopped
    command: php artisan horizon
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www/html
      - omp_temp:/var/www/html/storage/app/temp
    depends_on:
      - laravel
      - redis
    networks:
      - omp

  # ---------- Scheduler (cron: cleanup, trial expiry, resets) ----------
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omp_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www/html
      - omp_temp:/var/www/html/storage/app/temp
    depends_on:
      - laravel
    networks:
      - omp

  # ---------- Python heavy-processing worker ----------
  python-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: omp_worker
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    volumes:
      - omp_temp:/data/temp
    depends_on:
      - redis
    networks:
      - omp

  # ---------- MySQL ----------
  mysql:
    image: mariadb:11
    container_name: omp_mysql
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-onlymypdf}
      MARIADB_USER: ${DB_USERNAME:-onlymypdf}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - omp_mysql:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - omp

  # ---------- Redis (queues + cache + rate limits) ----------
  redis:
    image: redis:7-alpine
    container_name: omp_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - omp_redis:/data
    networks:
      - omp

  # ---------- nginx reverse proxy ----------
  nginx:
    image: nginx:1.27-alpine
    container_name: omp_nginx
    restart: unless-stopped
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - nextjs
      - laravel
    networks:
      - omp

volumes:
  omp_mysql:
  omp_redis:
  omp_temp:

networks:
  omp:
    driver: bridge
