# OnlyMyPDF reverse proxy.
# Routes /api and the admin panel to Laravel; everything else to Next.js.
# ADMIN_PATH default is only-admin-panel (keep in sync with backend env).

upstream nextjs_upstream { server nextjs:3000; }
upstream laravel_upstream { server laravel:8000; }

server {
    listen 80;
    server_name _;

    client_max_body_size 550M;   # largest Pro file limit + headroom

    # Laravel API
    location /api/ {
        proxy_pass http://laravel_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;   # heavy conversions
    }

    # Admin panel (Filament) + Horizon
    location ~ ^/(only-admin-panel|horizon) {
        proxy_pass http://laravel_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js (public site, tools, dashboard)
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
